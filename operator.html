<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Operator JavaScript</title>
</head>
<body>

    <h1>Operator JavaScript</h1>

    <script>
        let a = 10;
        let b = 3;

        console.log(a + b);
        console.log(a * b);
        console.log(a % b);
        console.log(a > b && b > 0);
    </script>

</body>
</html>
