<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>DOM dan Event</title>
</head>
<body>

    <h1>DOM dan Event</h1>

    <input type="text" id="nama" placeholder="Nama Anda">

    <button onclick="sapa()">Sapa</button>

    <p id="hasil"></p>

    <script>
        function sapa() {
            let nama = document.getElementById("nama").value;

            document.getElementById("hasil").textContent =
                "Halo, " + nama + "!";
        }
    </script>

</body>
</html>
